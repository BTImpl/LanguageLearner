name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run on the same branch or PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the Flutter version used locally.
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies (also generates the localizations)
        run: flutter pub get

      # The generated localization files are not formatted by us, so they are
      # left out of the format check.
      - name: Check formatting
        run: |
          git ls-files '*.dart' \
            | grep -v '^lib/i18n/app_localizations' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
